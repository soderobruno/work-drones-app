<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#101513"/>
  <rect x="56" y="56" width="400" height="400" rx="72" fill="#162118"/>
  <!-- Rotor arms -->
  <line x1="150" y1="150" x2="80" y2="80" stroke="#16c96b" stroke-width="22" stroke-linecap="round"/>
  <line x1="362" y1="150" x2="432" y2="80" stroke="#16c96b" stroke-width="22" stroke-linecap="round"/>
  <line x1="150" y1="362" x2="80" y2="432" stroke="#16c96b" stroke-width="22" stroke-linecap="round"/>
  <line x1="362" y1="362" x2="432" y2="432" stroke="#16c96b" stroke-width="22" stroke-linecap="round"/>
  <!-- Rotors -->
  <ellipse cx="80" cy="80" rx="44" ry="18" fill="#16c96b" opacity="0.9" transform="rotate(-45 80 80)"/>
  <ellipse cx="432" cy="80" rx="44" ry="18" fill="#16c96b" opacity="0.9" transform="rotate(45 432 80)"/>
  <ellipse cx="80" cy="432" rx="44" ry="18" fill="#16c96b" opacity="0.9" transform="rotate(45 80 432)"/>
  <ellipse cx="432" cy="432" rx="44" ry="18" fill="#16c96b" opacity="0.9" transform="rotate(-45 432 432)"/>
  <!-- Body -->
  <rect x="206" y="206" width="100" height="100" rx="20" fill="#16c96b"/>
  <rect x="226" y="226" width="60" height="60" rx="12" fill="#101513"/>
  <!-- Lens -->
  <circle cx="256" cy="256" r="18" fill="#16c96b" opacity="0.7"/>
  <circle cx="256" cy="256" r="9" fill="#0D1512"/>
</svg>
